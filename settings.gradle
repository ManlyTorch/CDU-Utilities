pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}
rootProject.name = 'CDU-Utilities'
include 'common'

if (providers.gradleProperty('build121').isPresent()) {
    include 'forge121', 'neoforge121', 'fabric121'
    project(':forge121').projectDir = file('1.21/forge')
    project(':neoforge121').projectDir = file('1.21/neoforge')
    project(':fabric121').projectDir = file('1.21/fabric')
} else {
    include 'forge', 'neoforge', 'fabric'
}