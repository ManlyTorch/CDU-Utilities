plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = "${mod_version}"
group = 'dev.ManlyTorch.cdu_utilities'

base {
    archivesName = "CDU-Utilities_neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

processResources {
    inputs.property 'mod_version', mod_version
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand 'mod_version': mod_version, 'neo_range': '[20.2,)', 'mc_range': '[1.20.2,1.21)'
    }
}

sourceSets {
    main {
        java { srcDir project(':common').file('src/main/java') }
        resources { srcDir project(':common').file('src/main/resources') }
    }
}

runs {
    client {
        modSource project.sourceSets.main
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

tasks.withType(JavaCompile).configureEach {
    exclude { it.file.toPath().startsWith(project(':common').projectDir.toPath()) && it.name == 'FakeSkinPlayer.java' }
}